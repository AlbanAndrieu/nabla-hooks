# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  # uv recipe: https://docs.readthedocs.io/en/stable/build-customization.html#install-dependencies-with-uv
  jobs:
    create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    install:
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --locked --only-group dev

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py
