[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nabla-hooks"
version = "1.0.7"
description = "Custom hooks to improve code quality before pushing to git"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
keywords = ["git-hooks", "pre-commit", "commit-validation", "jira", "code-quality", "linting"]
authors = [
    { name = "Alban Andrieu", email = "alban.andrieu@free.fr" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]
# Runtime dependencies of the git hooks (hooks/)
dependencies = [
    "click>=8.3.0",
    "colorama>=0.4.6",
    "commitizen>=4.10.0",
    "git-url-parse>=1.2.2",
    "gitpython>=3.1.45",
    "jira>=3.10.5",
    "pyyaml>=6.0.3",
    "termcolor>=3.1.0",
]

[project.urls]
"Homepage" = "https://github.com/AlbanAndrieu/nabla-hooks"
"Documentation" = "https://github.com/AlbanAndrieu/nabla-hooks/blob/master/README.md"
"Bug Tracker" = "https://github.com/AlbanAndrieu/nabla-hooks/issues"
"Changelog" = "https://github.com/AlbanAndrieu/nabla-hooks/blob/master/CHANGELOG.md"
"Gitter" = "https://gitter.im/nabla-hooks/Lobby"

[dependency-groups]
# FastAPI sample service (nabla/)
api = [
    "fastapi[standard]>=0.120.0",
    "uvicorn[standard]>=0.38.0",
    "prometheus-client>=0.23.1",
    "requests>=2.32.5",
]
encryption = [
    "cryptography>=46.0.3",
    "aiohttp>=3.13.1",
]
open-telemetry = [
    "opentelemetry-distro>=0.59b0",
    "opentelemetry-exporter-otlp>=1.38.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.38.0",
    "opentelemetry-instrumentation-fastapi>=0.59b0",
    "opentelemetry-instrumentation-logging>=0.59b0",
    "opentelemetry-api>=1.38.0",
    "opentelemetry-sdk>=1.38.0",
]
# Cookiecutter helpers (ccds/)
ccds = [
    "cookiecutter>=2.6.0",
    "loguru>=0.7.3",
    "tomlkit>=0.13.3",
]
# Declared historically but not imported by the code base
extra = [
    "ansicolors>=1.1.8",
    "asyncpg>=0.30.0",
    "click-completion>=0.5.2",
    "packaging>=25.0",
    "podmena>=0.6.1",
    "python-gitlab>=6.5.0",
    "python-keystoneclient>=5.6.0",
    "python-swiftclient>=4.8.0",
    "reretry>=0.11.8",
    "spacy>=3.8.7",
]
test = [
    { include-group = "api" },
    "coverage>=7.11.0",
    "httpx>=0.28.1",
    "mypy>=1.18.2",
    "nox>=2025.10.16",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-dependency>=0.6.0",
    "pytest-env>=1.2.0",
    "pytest-order>=1.3.0",
    "pytest-testinfra>=10.2.2",
    "tox>=4.32.0",
    "tox-uv>=1.29.0",
]
format = [
    "black>=25.9.0",
    "flake8>=7.3.0",
    "flake8-formatter-junit-xml>=0.0.6",
    "pylint>=4.0.2",
    "pylint-junit>=0.3.5",
    "ruff>=0.14.2",
]
dev = [
    "ansible-cmdb>=1.31",
    "ansible-lint[yamllint]>=25.9.2",
    "ansible-playbook-grapher>=2.11.0",
    "bandit>=1.8.6",
    # checkov pins old termcolor/packaging: run it with `uvx checkov` instead
    "molecule>=25.9.0",
    "pep8-naming>=0.15.1",
    "pre-commit>=4.3.0",
    "pre-commit-hooks>=6.0.0",
    "readme-renderer[md]>=44.0",
    "selenium>=4.38.0",
    "sphinx>=8.2.3",
    "twine>=6.2.0",
]

[tool.uv]
default-groups = ["api", "encryption", "test", "format", "dev"]

[tool.hatch.build.targets.wheel]
packages = ["hooks"]

[tool.hatch.build.targets.wheel.shared-scripts]
"bin/get_msg" = "get_msg"

[tool.hatch.build.targets.sdist]
include = ["/hooks", "/bin", "/README.md", "/LICENSE"]
exclude = ["/hooks/tests", "/hooks/*.egg-info"]

[tool.commitizen]
name = "cz_customize"
version_provider = "pep621"
update_changelog_on_bump = true

[tool.commitizen.customize]
message_template = "{{change_type}}:{% if show_message %} {{message}}{% endif %}"
example = "feature: this feature enable customize through config file"
schema = "<type>: <body>"
schema_pattern = "(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert):(\\s.*)"
bump_pattern = "^(break|new|fix|hotfix)"
bump_map = {"break" = "MAJOR", "new" = "MINOR", "fix" = "PATCH", "hotfix" = "PATCH"}
change_type_order = ["BREAKING CHANGE", "feat", "fix", "refactor", "perf"]
info_path = "cz_customize_info.txt"
info = """
This is customized info
"""
commit_parser = "^(?P<change_type>feat|fix):\\s(?P<message>.*)?"
changelog_pattern = "^(feat|fix)?(!)?"
change_type_map = {"feat" = "Feat", "fix" = "Fix"}

[[tool.commitizen.customize.questions]]
type = "list"
name = "change_type"
choices = [{value = "feat", name = "feat: A new feature."}, {value = "fix", name = "fix: A bug fix."}]
# choices = ["feat", "fix"]  # short version
message = "Select the type of change you are committing"

[[tool.commitizen.customize.questions]]
type = "input"
name = "message"
message = "Body."

[[tool.commitizen.customize.questions]]
type = "confirm"
name = "show_message"
message = "Do you want to add body message in commit?"

[tool.pytest.ini_options]
testpaths = "tests/"
# addopts = "--durations=12  --disable-socket --allow-hosts=localhost,127.0.0.1,::1 --strict-markers"
# asyncio_default_fixture_loop_scope = "session"
# asyncio_mode = "auto"  # See pytest-asyncio plug-in

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.pyright]
include = ["nabla"]
exclude = ["**/node_modules",
    "**/__pycache__",
    "nabla/experimental",
    "nabla/typestubs"
]
venvPath = "."
venv = ".venv"

reportMissingImports = "error"
reportMissingTypeStubs = false

pythonVersion = "3.13"
pythonPlatform = "Linux"

[tool.ruff]
# Enable the pycodestyle (`E`) and Pyflakes (`F`) rules by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
lint.select = ["E", "F"]
lint.ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
lint.fixable = ["ALL"]
lint.unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
lint.per-file-ignores = {}

# Same as Black.
line-length = 88

# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Minimum supported Python version
target-version = "py313"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.coverage.run]
branch = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*site-packages*",
    "*__init__.py",
]

[tool.mypy]
python_version = "3.13"
show_error_codes = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
# Disabling incremental mode is required for `warn_unused_configs = true` to work
incremental = false
disallow_untyped_defs = true
check_untyped_defs = true
strict_equality = true
implicit_reexport = false
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
