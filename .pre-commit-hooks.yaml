---
- id: git-branches-check
  name: Git branches check
  description: Check for old stale and already merged branches from the current repo with user friendly messages and colors
  entry: pre_commit_hooks/git-branches-check.sh
  language: script
  always_run: true
  types: [shell]
- id: jenkinsfile-check
  name: Jenkinsfile check
  description: Check if Jenkinsfile is valide
  entry: pre_commit_hooks/jenkinsfile-check.sh Jenkinsfile
  files: "Jenkinsfile"
  language: script
  types: [shell]
- id: jira-check
  name: JIRA check
  description: Check JIRA validation on commit message with user friendly messages and colors
  entry: hooks/validate_jira.py
  language: python
  stages: [commit-msg]
- id: issue-prefix
  name: Issue prefix
  description: Prefix the commit message with the JIRA, Linear or GitHub issue of the branch (feature/PROJ-123), after checking it is still open
  entry: hooks/get_msg.py
  language: python
  stages: [prepare-commit-msg]
- id: github-issue-check
  name: GitHub issue check
  description: Check that the commit message references a GitHub issue (#123, owner/repo#123 or GH-123)
  entry: hooks/validate_jira.py --tracker github
  language: python
  stages: [commit-msg]
