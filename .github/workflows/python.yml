---
name: Python package

on:
  # Trigger analysis when pushing in master or pull requests, and when creating
  # a pull request.
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    if: github.actor != 'dependabot[bot]' && github.actor!= 'dependabot-preview[bot]' # ignore the pull request which comes from user dependabot.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      JIRA_USER: aandrieu
      JIRA_PASSWORD: XXX
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint with flake8
        run: |
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide, but black 88
          uv run flake8 hooks tests --config .flake8 --count --exit-zero --max-line-length=88 --max-complexity=12 --statistics

      - name: Lint with pylint
        run: uv run ./scripts/run-pylint.sh

      - name: Lint with bandit
        run: uv run ./scripts/run-bandit.sh

      - name: Build package
        run: uv build

      - name: Test with pytest
        run: uv run pytest --cov=hooks --cov-fail-under=30 --junit-xml=junit.xml -o junit_family=xunit1

      - name: Test with tox
        run: uv run tox -e "py${UV_PYTHON//./}"

      - name: Upload Test Results to Trunk.io
        if: ${{ !cancelled() }} # Upload the results even if the tests fail
        continue-on-error: true # don't fail this job if the upload fails
        uses: trunk-io/analytics-uploader@v2
        with:
          junit-paths: "**/*.xml"
          org-slug: alban
          token: $TRUNK_API_TOKEN

  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0
      - name: SonarCloud Scan
        # You may pin to the exact commit or the version.
        uses: SonarSource/sonarqube-scan-action@v7.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
