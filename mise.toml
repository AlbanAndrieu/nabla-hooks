# mise.toml — Configuration universelle pour dotfiles workstation
# Place ce fichier dans ~/dotfiles/mise.toml ou dans ton HOME

[tools]
npm = "10.8.2"
python = "3.12.10"
biome = "2.3.14"
secretlint = "latest"
eslint = "latest"
stylelint = "latest"
remark = "latest"
prettier = "latest"
commitlint = "latest"
commitizen = "latest"
opencommit = "latest"
markdown-toc = "latest"
node = "24"

# Optionnel: outils utils & productivity (à activer selon besoins)
