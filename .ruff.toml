
# Extend the `pyproject.toml` file in the parent directory.
extend = "./pyproject.toml"

exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "docs",
    ".eggs",
    ".tox",
    ".venv",
    ".direnv",
    "noxfile.py",
    "nabla/panda/",
    "nabla/loki/influxdb.py",
    "nabla/_version.py",
    "hooks/pre-commit",  # generated by pre-commit
]
# But use a different line length.
line-length = 180

[lint]
ignore = ["E501", "E203", "RUF012"]
select = [
    "B",
    "C",
    "E",
    "F",
    "W",
    "S",
    "A",
    "LOG",
    "RUF",
    "PLC",
    "PLE",
    "PLW",
    "C90"
]

[lint.mccabe]
max-complexity = 10

[lint.per-file-ignores]
# Tests use fixtures (fake passwords, /tmp paths, local imports, shell=True).
"tests/**" = ["S101", "S105", "S106", "S108", "S602", "A002", "PLC0415"]
"hooks/tests/*" = ["S101", "RUF003"]
# Calls the trusted `cz` CLI from PATH.
"hooks/prepare_commit_msg.py" = ["S603", "S607"]
# Calls the trusted `gh` CLI from PATH; the issue argument is digits only.
"hooks/get_github.py" = ["S603", "S607"]
# Opens the fixed https API_URL only.
"hooks/get_linear.py" = ["S310"]
"nabla/tools/*" = ["S602", "S607"]

[format]
line-ending = "lf"
