[tox]
minversion=4.32.0
requires = tox-uv>=1.29
envlist=clean, flake8, {py313, py314}, package_description, docs
skip_missing_interpreters = True

[testenv]
# Install from uv.lock (tox-uv)
runner = uv-venv-lock-runner
dependency_groups = test
depends =
    {py313, py314}: clean
passenv = JIRA_USER,JIRA_PASSWORD,JIRA_URL,JIRA_CERT_PATH,JENKINS_URL
commands = pytest -s --cov=hooks --cov-append --cov-report=xml --junit-xml=output/pytest-report.xml
setenv =
    COVERAGE_FILE = {env:COVERAGE_FILE:{toxworkdir}/.coverage.{envname}}
    GIT_CONFIG_COUNT = 3
    # Set default branch for git to reduce log spam
    GIT_CONFIG_KEY_0 = init.defaultBranch
    GIT_CONFIG_VALUE_0 = master

[testenv:clean]
skip_install = true
dependency_groups =
commands = rm -Rf _build/ build/ .eggs/ dist/ output/pytest-report.xml .coverage output/coverage.xml docs/_build/ .scannerwork/ .pytest_cache/ output/htmlcov/ cprofile pytest-report.xml coverage.xml
allowlist_externals=rm

[testenv:py313]
description = run the tests with pytest under {basepython}
basepython = python3.13

[testenv:py314]
description = run the tests with pytest under {basepython}
basepython = python3.14

[testenv:flake8]
dependency_groups = format
commands = flake8 --config .flake8 --count --exit-zero --max-line-length=88 --max-complexity=12 --statistics

[testenv:linters]
dependency_groups = format, dev
commands = flake8 {posargs} hooks
           flake8 {posargs} tests
           bandit -r hooks -ll -ii

[testenv:docs]
description = invoke sphinx-build to build the HTML docs
basepython = python3.14
dependency_groups = dev
commands = sphinx-build ./docs _build --color -W -bhtml
           python -c 'import pathlib; print("documentation available under file://\{0\}".format(pathlib.Path(r"{toxworkdir}") / "_build" / "index.html"))'

[testenv:package_description]
description = check that the long description is valid
basepython = python3.14
runner = uv-venv-runner
skip_install = true
dependency_groups =
deps = twine >= 6.2.0
       readme-renderer[md] >= 44.0
       build >= 1.3.0
commands = python -m build --outdir {envtmpdir}/build .
           twine check {envtmpdir}/build/*

[testenv:fix_lint]
description = format the code base to adhere to our styles, and complain about what we cannot do automatically
basepython = python3.14
passenv = {[testenv]passenv}
          HOMEPATH
          # without PROGRAMDATA cloning using git for Windows will fail with an
          # `error setting certificate verify locations` error
          PROGRAMDATA
dependency_groups = dev
skip_install = True
commands = pre-commit run --all-files --show-diff-on-failure
           python -c 'import pathlib; print("hint: run \{\} install to add checks as pre-commit hook".format(pathlib.Path(r"{envdir}") / "bin" / "pre-commit"))'

[testenv:report]
depends =
    {py314}: testenv
skip_install = true
setenv = COVERAGE_FILE={toxworkdir}/.coverage
commands = coverage combine
           coverage report -m
           coverage xml -o output/coverage.xml
           coverage html -d output/htmlcov

[testenv:coverage]
description = [run locally after tests]: combine coverage data and create report;
              generates a diff coverage against origin/master (can be changed by setting DIFF_AGAINST env var)
runner = uv-venv-runner
deps = coverage
       diff_cover
dependency_groups =
skip_install = true
passenv = {[testenv]passenv}
          DIFF_AGAINST
setenv = COVERAGE_FILE={toxworkdir}/.coverage
commands = coverage combine
           coverage report -m
           coverage xml -o output/coverage.xml
           coverage html -d output/htmlcov
           diff-cover --compare-branch {env:DIFF_AGAINST:origin/master} output/coverage.xml

[testenv:dev]
description = dev environment with all deps at {envdir}
dependency_groups = test, format, dev
commands = uv pip list
           python -c "print(r'{envpython}')"
allowlist_externals = uv

[flake8]
max-complexity = 22
max-line-length = 88

[pep8]
max-line-length = 99

[gh-actions]
python = 3.13: py313
         3.14: py314
